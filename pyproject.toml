[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-interactive-macros"
version = "0.1.0"
description = "Interactive Slurm workbenches"
requires-python = ">=3.10"

[project.scripts]
sim = "sim.cli:main"

[tool.setuptools.package-data]
sim = ["data/*"]

[tool.setuptools.packages.find]
where = ["src"]
